name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Les tests des scénarios pilotent le SDK Python via `uv run`.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "api-tests/**/*.py"
      - run: bun install --frozen-lockfile
      # Cache uv froid : le premier appel d'un script Python dépasserait les délais des tests.
      - name: Préchauffer les dépendances Python
        run: for f in $(grep -rl '^# /// script' api-tests); do uv sync --script "$f" -q; done
      # Le catalogue lit openapi.json au démarrage. Certaines sources secondaires du snapshot
      # sont absentes à ce commit (le script sort en 2) : seul openapi.json est exigé.
      - name: Snapshot du contrat
        working-directory: codex-contract-atlas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run snapshot || test -s snapshot/openapi.json
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Tests de l'atlas
        working-directory: codex-contract-atlas
        run: npm test
