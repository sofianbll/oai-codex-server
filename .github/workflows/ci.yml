name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Le catalogue lit openapi.json au démarrage. Certaines sources secondaires du snapshot
      # sont absentes à ce commit (le script sort en 2) : seul openapi.json est exigé.
      - name: Snapshot du contrat
        working-directory: codex-contract-atlas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run snapshot || test -s snapshot/openapi.json
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Tests de l'atlas
        working-directory: codex-contract-atlas
        run: npm test
