# Reçoit l'export OTLP natif de la CLI Codex et l'écrit en JSONL (une ligne par lot) pour jq.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file:
    path: /out/codex-otel.jsonl

service:
  pipelines:
    logs: { receivers: [otlp], exporters: [file] }
    traces: { receivers: [otlp], exporters: [file] }
    metrics: { receivers: [otlp], exporters: [file] }
